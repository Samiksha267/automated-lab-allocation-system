name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # actions/setup-java, not backend/mvnw: the wrapper script is tracked in git
      # without its executable bit (100644), so `./mvnw` fails on Linux runners with
      # "Permission denied" until that's fixed at the source and committed. Using the
      # JDK's bundled Maven directly sidesteps that entirely and matches the exact
      # Maven version (3.9.x) this project's own Docker-based local verification
      # already used throughout Phases 20-26.
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile
        run: mvn -B compile

      - name: Unit tests
        run: mvn -B test

      # This runner has a real, native Docker daemon (unlike this project's local
      # development sandbox, which only has Docker reachable from a *nested* Maven
      # build container with no socket access - see docs/11-TESTING-STRATEGY.md).
      # `-Dsurefire.skip=true` skips re-running the already-passed *Test suite so
      # this step's own pass/fail is unambiguously about the Testcontainers-backed
      # *IT suite (maven-failsafe-plugin, already configured in pom.xml, bound to
      # its standard integration-test/verify phases - no new plugin wiring needed).
      - name: Integration tests (Testcontainers)
        run: mvn -B verify -Dsurefire.skip=true

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (npm ci - reproducible, lockfile-pinned)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    env:
      # CI-only, disposable placeholders - never a real secret, never used outside this
      # ephemeral runner, unique per run so no two concurrent runs could ever collide.
      # ProductionJwtSecretGuard (backend, Phase 26) requires >=32 bytes; this clears it
      # by a wide margin, deliberately proving the `prod` profile actually boots here -
      # docs/12-DEPLOYMENT-GUIDE.md's local verification only ever exercised `dev`.
      POSTGRES_PASSWORD: ci-only-postgres-password-${{ github.run_id }}
      JWT_SECRET: ci-only-jwt-secret-placeholder-at-least-32-bytes-long-${{ github.run_id }}
      SPRING_PROFILES_ACTIVE: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config

      - name: Build images (backend + frontend, the real deployment Dockerfiles)
        run: docker compose build

      - name: Compose smoke test (prod profile, fresh database)
        run: |
          set -e
          docker compose up -d
          echo "Waiting for backend to report healthy..."
          backend_cid=$(docker compose ps -q backend)
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$backend_cid" 2>/dev/null || echo starting)
            echo "  [$i/30] backend health: $status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$i" = "30" ]; then
              echo "backend never became healthy" >&2
              exit 1
            fi
            sleep 5
          done
          docker compose ps
          echo "--- backend health endpoint ---"
          curl -sf http://localhost:8080/actuator/health
          echo
          echo "--- frontend root ---"
          curl -sf -o /dev/null -w "frontend: %{http_code}\n" http://localhost:5173/

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Compose cleanup
        if: always()
        run: docker compose down -v
