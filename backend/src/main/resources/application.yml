spring:
  application:
    name: lab-allocation-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lab_allocation}
    username: ${DB_USER:lab_user}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates the mapped entities against it
      # at startup - it must never create/alter tables (see docs/15-DESIGN-DECISIONS.md).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only health and info are exposed publicly at this phase - the full actuator
        # surface (env, beans, etc.) is not opened up until there is a reason to.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # JWT_SECRET must be overridden with a real, randomly-generated secret
    # (see docs/12-DEPLOYMENT-GUIDE.md) outside of local/dev use - the fallback
    # below is an *obviously* non-production placeholder, long enough to
    # satisfy HS256's minimum key-length requirement, never meant to be
    # relied on beyond a bare `./mvnw spring-boot:run` with no .env configured.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
