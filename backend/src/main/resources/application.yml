spring:
  application:
    name: lab-allocation-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lab_allocation}
    username: ${DB_USER:lab_user}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates the mapped entities against it
      # at startup - it must never create/alter tables (see docs/15-DESIGN-DECISIONS.md).
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      # Phase 19 PDF upload - Spring's own enforcement, in addition to
      # TimetableImportService's own explicit MAX_FILE_SIZE_BYTES check
      # (defense in depth, PART 11/45): a request whose file exceeds this is
      # rejected by Spring before the controller method (and therefore this
      # project's own limit check) is ever reached.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only health and info are exposed publicly at this phase - the full actuator
        # surface (env, beans, etc.) is not opened up until there is a reason to.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    db:
      enabled: true

app:
  college:
    # The single timezone every Allocation's LocalDate+LocalTime is interpreted
    # in when bridged to an Instant (e.g. to compare against LabUnavailability's
    # TIMESTAMPTZ range, HC-06, Phase 9) - see SchedulingTimeMapper. A real
    # IANA zone id (never a manual UTC+offset), so DST rules (if the deployment
    # zone ever has any) are handled correctly by the JDK, not by hand.
    time-zone: ${COLLEGE_TIME_ZONE:Asia/Kolkata}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  scoring:
    # Centralized soft-scoring weights (docs/07-ALLOCATION-SCORING.md) - only
    # the three factors Phase 11 found implementable have a weight; Additional
    # Environment Fit, Faculty Preference and Fewer Timetable Gaps are
    # deferred (no underlying data yet) and deliberately have none.
    capacity-fit-weight: ${SCORING_CAPACITY_FIT_WEIGHT:30}
    preferred-lab-type-weight: ${SCORING_PREFERRED_LAB_TYPE_WEIGHT:15}
    balanced-utilization-weight: ${SCORING_BALANCED_UTILIZATION_WEIGHT:15}
  scheduling:
    # Authoritative college scheduling-slot rules for Phase 13 alternative-time
    # search - collected directly from the user (docs/ASSUMPTIONS.md A-35),
    # never assumed. Sessions run in fixed 2-hour blocks starting on the hour;
    # day-start/day-end bound the latest possible start hour (17:00, since
    # 17:00+2h=19:00). Working days Monday-Saturday. max-lookahead-days was not
    # given an exact number ("up to N, a small number like 2-3") - defaults to
    # 3, this project's own documented choice within the user's stated bound.
    day-start-time: "${SCHEDULING_DAY_START_TIME:09:00}"
    day-end-time: "${SCHEDULING_DAY_END_TIME:19:00}"
    slot-step-minutes: ${SCHEDULING_SLOT_STEP_MINUTES:60}
    working-days: ${SCHEDULING_WORKING_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY}
    max-lookahead-days: ${SCHEDULING_MAX_LOOKAHEAD_DAYS:3}
    max-alternative-time-slots-searched: ${SCHEDULING_MAX_ALTERNATIVE_TIME_SLOTS_SEARCHED:6}
    max-alternative-suggestions: ${SCHEDULING_MAX_ALTERNATIVE_SUGGESTIONS:3}
    # The confirmed fixed session duration (PART 11 of the Phase 14 brief) - made an
    # explicit policy value here since Phase 14's automatic scheduling has no single
    # original request to derive a duration from, unlike Phase 13's alternative search.
    session-duration-minutes: ${SCHEDULING_SESSION_DURATION_MINUTES:120}
    backtracking:
      # Phase 14 automatic-scheduling search bounds (docs/05-SCHEDULING-ENGINE.md) - a
      # genuinely bounded DFS/backtracking search, never unbounded recursion (PART 35).
      max-nodes: ${SCHEDULING_BACKTRACKING_MAX_NODES:2000}
      max-requirements: ${SCHEDULING_BACKTRACKING_MAX_REQUIREMENTS:20}
      max-date-range-days: ${SCHEDULING_BACKTRACKING_MAX_DATE_RANGE_DAYS:31}
  jwt:
    # JWT_SECRET must be overridden with a real, randomly-generated secret
    # (see docs/12-DEPLOYMENT-GUIDE.md) outside of local/dev use - the fallback
    # below is an *obviously* non-production placeholder, long enough to
    # satisfy HS256's minimum key-length requirement, never meant to be
    # relied on beyond a bare `./mvnw spring-boot:run` with no .env configured.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-signing-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
